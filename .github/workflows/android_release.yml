name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Granted to the reused Quality Checks gate, which declares read access to pull requests.
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails within seconds instead of after the gate when the release notes are missing.
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -s "docs/releases/$RELEASE_TAG.md"

  # The same parallel gate as every push (check graph, Rust coverage, four native ABIs, Android
  # delivery with coverage), forced to the full surface.
  gate:
    needs: notes
    uses: ./.github/workflows/architecture_checks.yml
    with:
      full: true

  release:
    needs: [notes, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '27'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned cargo tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lomo/cargo-tools
          key: cargo-tools-1.99-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'quality/tools.toml') }}
      - name: Restore release build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/lomo/detekt
            ~/.cache/lomo/gradle
            ~/.cache/lomo/lint-checks
            ~/.cache/JetBrains/Kotlin
            ~/.gradle/caches
            ~/.gradle/wrapper
            target/cargo
            target/lomo/build
            ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
          key: release-1.99-ndk30-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'quality/tools.toml', 'kotlin', 'apps/android/project.yaml', '**/module.yaml') }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: release-1.99-ndk30-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'quality/tools.toml', 'kotlin', 'apps/android/project.yaml', '**/module.yaml') }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          # The toolchain owns release signing (settings.android.signing in
          # apps/android/app/module.yaml): it reads keystore.properties in the module
          # directory and resolves a relative storeFile from there.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > apps/android/app/release.keystore
          test -s apps/android/app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > apps/android/app/keystore.properties
      - name: Bootstrap pinned toolchain
        run: cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- bootstrap
      - name: Save pinned cargo tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lomo/cargo-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Build, validate, and verify release APKs
        run: |
          # The universal build compiles all four release natives first; the split builds then
          # reuse those Cargo outputs and only repackage.
          for abi in all arm64-v8a armeabi-v7a x86_64 x86; do
            echo "Building release APK for $abi..."
            cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- build android release "$abi"
          done
      - name: Save release build cache
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/lomo/detekt
            ~/.cache/lomo/gradle
            ~/.cache/lomo/lint-checks
            ~/.cache/JetBrains/Kotlin
            ~/.gradle/caches
            ~/.gradle/wrapper
            target/cargo
            target/lomo/build
            ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload release APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apks
          path: |
            target/lomo/artifacts/android/release/Lomo-*.apk
            target/lomo/artifacts/android/release/lomo-v*-vc*.apk
          if-no-files-found: error
      - name: Validate release tag matches the universal APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          apks=(target/lomo/artifacts/android/release/lomo-"$RELEASE_TAG"-vc*.apk)
          test "${#apks[@]}" -eq 1
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Lomo ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            target/lomo/artifacts/android/release/Lomo-*.apk
            target/lomo/artifacts/android/release/lomo-v*-vc*.apk
      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports
          path: reports/**
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f apps/android/app/release.keystore apps/android/app/keystore.properties
