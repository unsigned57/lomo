name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails within seconds instead of after the gate when the release notes are missing.
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -s "docs/releases/$RELEASE_TAG.md"

  # Quality Checks owns execution. A tag consumes the same commit's completed full gate;
  # concurrent branch/tag pushes wait for that one run instead of compiling it twice.
  gate:
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Verify the commit's completed quality gate
        id: quality-result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          deadline=$((SECONDS + 5400))
          discovery_attempts=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/architecture_checks.yml/runs" \
              -f "head_sha=$RELEASE_SHA" -f per_page=100)"
            candidate="$(jq -c --arg sha "$RELEASE_SHA" --arg repo "$REPOSITORY" --arg branch "$DEFAULT_BRANCH" '
              .workflow_runs | map(select(
                .head_sha == $sha and .head_repository.full_name == $repo and
                .path == ".github/workflows/architecture_checks.yml" and
                (.event == "workflow_dispatch" or (.event == "push" and .head_branch == $branch))))
              | sort_by(.run_number) | reverse | .[0]' <<< "$runs")"
            if [ "$candidate" = null ]; then
              discovery_attempts=$((discovery_attempts + 1))
              if [ "$discovery_attempts" -ge 15 ]; then
                echo "No Quality Checks run for $RELEASE_SHA; push the commit to the default branch or run Quality Checks manually first." >&2
                exit 1
              fi
            else
              run_id="$(jq -er '.id | numbers' <<< "$candidate")"
              status="$(jq -er '.status | strings' <<< "$candidate")"
              case "$status" in
                completed)
                  conclusion="$(jq -er '.conclusion | strings' <<< "$candidate")"
                  if [ "$conclusion" != success ]; then
                    echo "Quality Checks run $run_id ended $conclusion; release is blocked." >&2
                    exit 1
                  fi
                  jobs="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
                  jq -e '
                    [.[].jobs[]] |
                    def passed($name): any(.[]; .name == $name and .status == "completed" and .conclusion == "success");
                    passed("check") and passed("rust-host") and passed("android-kotlin") and passed("quality") and
                    ([.[] | select(.name | startswith("native ("))] |
                     length > 0 and all(.[]; .status == "completed" and .conclusion == "success"))
                  ' <<< "$jobs" >/dev/null || {
                    echo "Run $run_id has no complete passing delivery gate; run full Quality Checks for this commit first." >&2
                    exit 1
                  }
                  echo "quality_run_id=$run_id" >> "$GITHUB_OUTPUT"
                  echo "Using https://github.com/$REPOSITORY/actions/runs/$run_id for $RELEASE_SHA"
                  exit 0
                  ;;
                queued|requested|waiting|pending|in_progress) ;;
                *) echo "Unknown Quality Checks status: $status" >&2; exit 1 ;;
              esac
            fi
            sleep 20
          done
          echo "Timed out waiting for Quality Checks for $RELEASE_SHA" >&2
          exit 1

  # Compile the shipping profile while gate waits for the same commit's Quality Checks.
  release-native:
    needs: notes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned cargo tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &cargo_tools
          path: ~/.cache/lomo/cargo-tools
          key: cargo-tools-1.99-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'quality/tools.toml') }}
      - name: Restore Cargo downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &cargo_downloads
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'quality/tools.toml') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and verify ${{ matrix.abi }} (release-android)
        env:
          ABI: ${{ matrix.abi }}
        run: cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- ci-native release "$ABI"
      - name: Stage the library and its build stamp
        env:
          ABI: ${{ matrix.abi }}
        run: |
          dir="target/lomo/tmp/release-native/$ABI"
          mkdir -p "$dir"
          cp "apps/android/app/jniLibs/$ABI/liblomo_native_jni.so" \
             target/lomo/build/android-libraries.json "$dir/"
      - name: Upload release native library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-${{ matrix.abi }}
          path: target/lomo/tmp/release-native/
          if-no-files-found: error
          overwrite: true

  release:
    needs: [gate, release-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '27'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned cargo tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *cargo_tools
      - name: Restore Cargo downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *cargo_downloads
      - name: Restore Android dependencies
        id: android-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.cache/lomo/gradle
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: android-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin', 'apps/android/kotlin') }}-${{ hashFiles('apps/android/project.yaml', '**/module.yaml', 'apps/android/benchmark/build.gradle.kts') }}
          restore-keys: android-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin', 'apps/android/kotlin') }}-
      - name: Restore Android host build
        id: android-host
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cargo/debug
            target/cargo/boltffi-source-records
          key: android-host-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'quality/tools.toml') }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: android-host-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'quality/tools.toml') }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Download release native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-native-*
          path: target/lomo/tmp/release-native
          merge-multiple: true
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          # The toolchain owns release signing (settings.android.signing in
          # apps/android/app/module.yaml): it reads keystore.properties in the module
          # directory and resolves a relative storeFile from there.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > apps/android/app/release.keystore
          test -s apps/android/app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > apps/android/app/keystore.properties
      - name: Build, validate, and verify release APKs
        run: |
          cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- \
            build android release --native-artifacts target/lomo/tmp/release-native
      - name: Validate release tag matches the universal APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          apks=(target/lomo/artifacts/android/release/lomo-"$RELEASE_TAG"-vc*.apk)
          test "${#apks[@]}" -eq 1
      - name: Upload release APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apks
          path: |
            target/lomo/artifacts/android/release/Lomo-*.apk
            target/lomo/artifacts/android/release/lomo-v*-vc*.apk
          if-no-files-found: error
          overwrite: true
      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports
          path: reports/**
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f apps/android/app/release.keystore apps/android/app/keystore.properties

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download signed release APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apks
          path: release-files
      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Lomo ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-files/Lomo-*.apk
            release-files/lomo-v*-vc*.apk
