name: TUI Release

on:
  push:
    tags:
      - 'tui-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tui-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Resolve the release version once: tag name wins, Cargo.toml is the manual-dispatch fallback.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#tui-v}"
          if [ "$version" = "${{ github.ref_name }}" ]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("apps/tui/Cargo.toml","rb"))["package"]["version"])')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Full quality gate runs once on Linux, then produces the Linux artifact.
  gate:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore pinned cargo tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lomo/cargo-tools
          key: cargo-tools-1.99-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'quality/tools.toml') }}
      - name: Restore host build
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cargo
            target/lomo/build
          key: tui-release-1.99-${{ hashFiles('Cargo.lock', 'quality/tools.toml', 'rust-toolchain.toml') }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tui-release-1.99-${{ hashFiles('Cargo.lock', 'quality/tools.toml', 'rust-toolchain.toml') }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned Rust tools
        run: RUSTUP_TOOLCHAIN=1.99 cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- bootstrap-rust
      - name: Save pinned cargo tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lomo/cargo-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Run Rust host gate (no coverage)
        run: RUSTUP_TOOLCHAIN=1.99 cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- ci-rust fast
      - name: Build release binary
        run: RUSTUP_TOOLCHAIN=1.99 cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- build tui release
      - name: Save host build
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cargo
            target/lomo/build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Package tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          dist="lomo-${VERSION}-x86_64-unknown-linux-gnu"
          staging="target/lomo/tmp/tui-release/$dist"
          mkdir -p "$staging/completions" target/lomo/artifacts/tui/dist
          cp target/lomo/artifacts/tui/release/lomo LICENSE "$staging/"
          strip "$staging/lomo"
          "./$staging/lomo" --generate-completions bash > "$staging/completions/lomo.bash"
          "./$staging/lomo" --generate-completions zsh > "$staging/completions/_lomo"
          "./$staging/lomo" --generate-completions fish > "$staging/completions/lomo.fish"
          tar -czf "target/lomo/artifacts/tui/dist/${dist}.tar.gz" -C target/lomo/tmp/tui-release "$dist"
          (cd target/lomo/artifacts/tui/dist && sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256")
      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lomo-tui-x86_64-unknown-linux-gnu
          path: target/lomo/artifacts/tui/dist/*
          if-no-files-found: error

  # Per-OS native builds: each backend must compile and pass its platform
  # contract suite on the real kernel/filesystem, then package natively.
  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            shell_kind: unix
          - os: macos-latest
            target: aarch64-apple-darwin
            shell_kind: unix
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            shell_kind: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore pinned cargo tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lomo/cargo-tools
          key: cargo-tools-1.99-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'quality/tools.toml') }}
      - name: Restore host build
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cargo
            target/lomo/build
          key: tui-release-1.99-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'quality/tools.toml', 'rust-toolchain.toml') }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tui-release-1.99-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'quality/tools.toml', 'rust-toolchain.toml') }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99 --profile minimal
      - name: Bootstrap pinned Rust tools
        run: RUSTUP_TOOLCHAIN=1.99 cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- bootstrap-rust
      - name: Save pinned cargo tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lomo/cargo-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Verify platform filesystem contract
        run: RUSTUP_TOOLCHAIN=1.99 cargo test --manifest-path Cargo.toml --locked -p lomo-platform-fs
      - name: Build release binary
        run: RUSTUP_TOOLCHAIN=1.99 cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- build tui release
      - name: Save host build
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cargo
            target/lomo/build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Package tarball (Unix)
        if: matrix.shell_kind == 'unix'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dist="lomo-${VERSION}-${TARGET}"
          staging="target/lomo/tmp/tui-release/$dist"
          mkdir -p "$staging/completions" target/lomo/artifacts/tui/dist
          cp target/lomo/artifacts/tui/release/lomo LICENSE "$staging/"
          strip "$staging/lomo"
          "./$staging/lomo" --generate-completions bash > "$staging/completions/lomo.bash"
          "./$staging/lomo" --generate-completions zsh > "$staging/completions/_lomo"
          "./$staging/lomo" --generate-completions fish > "$staging/completions/lomo.fish"
          tar -czf "target/lomo/artifacts/tui/dist/${dist}.tar.gz" -C target/lomo/tmp/tui-release "$dist"
          (cd target/lomo/artifacts/tui/dist && shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256")
      - name: Package zip (Windows)
        if: matrix.shell_kind == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = "lomo-$env:VERSION-$env:TARGET"
          $staging = "target/lomo/tmp/tui-release/$dist"
          New-Item -ItemType Directory -Force "$staging/completions", "target/lomo/artifacts/tui/dist" | Out-Null
          Copy-Item target/lomo/artifacts/tui/release/lomo.exe, LICENSE "$staging/"
          & "./$staging/lomo.exe" --generate-completions powershell > "$staging/completions/lomo.ps1"
          & "./$staging/lomo.exe" --generate-completions bash > "$staging/completions/lomo.bash"
          & "./$staging/lomo.exe" --generate-completions zsh > "$staging/completions/_lomo"
          & "./$staging/lomo.exe" --generate-completions fish > "$staging/completions/lomo.fish"
          Compress-Archive -Path "$staging" -DestinationPath "target/lomo/artifacts/tui/dist/$dist.zip"
          Push-Location target/lomo/artifacts/tui/dist
          $hash = (Get-FileHash -Algorithm SHA256 "$dist.zip").Hash.ToLower()
          "$hash  $dist.zip" | Out-File -Encoding ascii -NoNewline "$dist.zip.sha256"
          Pop-Location
      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lomo-tui-${{ matrix.target }}
          path: target/lomo/artifacts/tui/dist/*
          if-no-files-found: error

  # One release row per tag: every platform archive plus its checksum.
  publish:
    needs: [version, gate, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lomo-tui-*
          path: release-files
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-files/*
          generate_release_notes: true
