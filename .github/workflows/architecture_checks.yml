name: Quality Checks

on:
  pull_request:
  push:
    tags-ignore:
      - 'v*'
      - 'tui-v*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      native: ${{ steps.filter.outputs.native }}
      quality_infra: ${{ steps.filter.outputs.quality_infra }}
      run_rust: ${{ steps.flags.outputs.run_rust }}
      run_native: ${{ steps.flags.outputs.run_native }}
      run_android: ${{ steps.flags.outputs.run_android }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/tui/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'quality/tools.toml'
              - 'quality/rust/deny.toml'
              - '.clippy.toml'
              - '.rustfmt.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
              - 'Justfile'
            kotlin:
              - 'apps/android/**'
              - 'quality/**'
              - 'kotlin'
            native:
              - 'crates/lomo-native/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'quality/tools.toml'
              - 'rust-toolchain.toml'
              - 'crates/lomo-xtask/src/native.rs'
              - 'crates/lomo-xtask/src/android.rs'
              - 'crates/lomo-xtask/src/tools.rs'
            quality_infra:
              - 'fixtures/**'
              - '.config/nextest.toml'
              - 'Justfile'
              - '.githooks/**'
              - '.github/workflows/**'
              - '.editorconfig'
              - 'quality/**'
              - 'AGENTS.md'
              - 'ARCHITECTURE.md'
              - 'apps/android/project.yaml'
      - name: Derive required job flags
        id: flags
        run: |
          rust='${{ steps.filter.outputs.rust }}'
          kotlin='${{ steps.filter.outputs.kotlin }}'
          native='${{ steps.filter.outputs.native }}'
          quality='${{ steps.filter.outputs.quality_infra }}'
          # workflow_dispatch always runs the full PR surface.
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            rust=true; kotlin=true; native=true; quality=true
          fi
          run_rust=false
          run_native=false
          run_android=false
          if [ "$rust" = 'true' ] || [ "$quality" = 'true' ]; then run_rust=true; fi
          # jniLibs are required for Kotlin APK packaging and for native contract verification.
          if [ "$rust" = 'true' ] || [ "$native" = 'true' ] || [ "$kotlin" = 'true' ] || [ "$quality" = 'true' ]; then run_native=true; fi
          # Rust owner changes can propagate through lomo-native into Kotlin consumers.
          if [ "$rust" = 'true' ] || [ "$kotlin" = 'true' ] || [ "$quality" = 'true' ]; then run_android=true; fi
          # Docs-only / unmatched changes still exercise the Rust host surface.
          if [ "$run_rust" = 'false' ] && [ "$run_native" = 'false' ] && [ "$run_android" = 'false' ]; then
            run_rust=true
          fi
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
          echo "run_native=$run_native" >> "$GITHUB_OUTPUT"
          echo "run_android=$run_android" >> "$GITHUB_OUTPUT"
      - name: Skip duplicate push runs with an open PR
        id: guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          if gh pr list --head "$branch" --state open --json number --jq 'length > 0' | grep -qx true; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  rust-host:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache pinned Rust tools and host build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/lomo/cargo-tools
            target/cargo
            target/lomo/build
          key: rust-host-1.99-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'quality/tools.toml') }}
      - name: Bootstrap pinned Rust tools
        run: cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- bootstrap-rust
      - name: Run Rust host gate (no coverage)
        run: cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- ci-rust fast

  native:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.run_native == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Cache pinned native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/lomo/cargo-tools
            target/cargo
            target/lomo/build
            ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
          key: native-1.99-ndk30-${{ matrix.abi }}-release-ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'quality/tools.toml') }}
      - name: Bootstrap pinned native toolchain
        run: cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- bootstrap
      - name: Build and verify ${{ matrix.abi }} (release-ci)
        run: cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- ci-native release-ci ${{ matrix.abi }}
      - name: Upload native libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.abi }}
          path: apps/android/app/jniLibs/${{ matrix.abi }}/*
          if-no-files-found: error

  android-kotlin:
    runs-on: ubuntu-latest
    needs: [changes, native]
    if: |
      always() &&
      needs.changes.outputs.skip != 'true' &&
      needs.changes.outputs.run_android == 'true' &&
      (needs.changes.outputs.run_native != 'true' || needs.native.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '27'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Cache Android and Kotlin toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/lomo
            ~/.cache/JetBrains/Kotlin
            ~/.gradle/caches
            ~/.gradle/wrapper
            target/cargo
            target/lomo/build
            ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
          key: android-1.99-ndk30-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'quality/tools.toml', 'kotlin', 'apps/android/project.yaml', '**/module.yaml') }}
      - name: Download arm64-v8a
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-arm64-v8a
          path: apps/android/app/jniLibs/arm64-v8a
      - name: Download armeabi-v7a
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-armeabi-v7a
          path: apps/android/app/jniLibs/armeabi-v7a
      - name: Download x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-x86_64
          path: apps/android/app/jniLibs/x86_64
      - name: Download x86
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-x86
          path: apps/android/app/jniLibs/x86
      - name: Bootstrap pinned toolchain
        run: cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- bootstrap
      - name: Run Android and Kotlin gate (no coverage)
        env:
          MEANINGFUL_TEST_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MEANINGFUL_TEST_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: cargo run --manifest-path Cargo.toml --locked -p lomo-xtask -- ci-android fast
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: target/lomo/artifacts/android/debug/Lomo-*.apk
          if-no-files-found: error
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: reports/**
          if-no-files-found: ignore

  quality:
    if: always() && needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    needs: [changes, rust-host, native, android-kotlin]
    steps:
      - name: Aggregate required quality jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_RUST: ${{ needs.changes.outputs.run_rust }}
          RUN_NATIVE: ${{ needs.changes.outputs.run_native }}
          RUN_ANDROID: ${{ needs.changes.outputs.run_android }}
          RUST_HOST: ${{ needs.rust-host.result }}
          NATIVE: ${{ needs.native.result }}
          ANDROID_KOTLIN: ${{ needs.android-kotlin.result }}
        run: |
          test "$CHANGES" = success
          require() {
            local need="$1"
            local result="$2"
            local name="$3"
            if [ "$need" = 'true' ]; then
              test "$result" = 'success' || {
                echo "$name required but result=$result" >&2
                exit 1
              }
            else
              case "$result" in
                success|skipped) ;;
                *)
                  echo "$name unexpected result=$result when not required" >&2
                  exit 1
                  ;;
              esac
            fi
          }
          require "$RUN_RUST" "$RUST_HOST" rust-host
          require "$RUN_NATIVE" "$NATIVE" native
          require "$RUN_ANDROID" "$ANDROID_KOTLIN" android-kotlin
          echo "quality aggregate ok"
