name: Quality Nightly Coverage

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
  HOME: ${{ github.workspace }}/.home
  ANDROID_USER_HOME: ${{ github.workspace }}/.android
  XDG_DATA_HOME: ${{ github.workspace }}/.local/share
  XDG_CONFIG_HOME: ${{ github.workspace }}/.config
  LOMO_KOTLIN_GRADLE_USER_HOME: ${{ github.workspace }}/.gradle/kotlin-toolchain
  KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ github.workspace }}/.kotlin-cli

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up JDK 26
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '26'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Cache toolchains
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache
            .gradle/kotlin-toolchain
            .kotlin-cli
            rust/target
            ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: nightly-coverage-1.97-ndk29-${{ hashFiles('rust/Cargo.lock', 'rust/tools.toml', 'kotlin', 'project.yaml', '**/module.yaml') }}
      - name: Bootstrap pinned toolchain
        run: RUSTUP_TOOLCHAIN=1.97 cargo run --manifest-path rust/Cargo.toml --locked -p lomo-xtask -- bootstrap
      - name: Rust coverage gate
        run: RUSTUP_TOOLCHAIN=1.97 cargo run --manifest-path rust/Cargo.toml --locked -p lomo-xtask -- ci-rust coverage
      - name: Build release-ci native libraries for Android coverage packaging
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            RUSTUP_TOOLCHAIN=1.97 cargo run --manifest-path rust/Cargo.toml --locked -p lomo-xtask -- ci-native release-ci "$abi"
          done
      - name: Android/Kotlin coverage gate
        run: RUSTUP_TOOLCHAIN=1.97 cargo run --manifest-path rust/Cargo.toml --locked -p lomo-xtask -- ci-android coverage
