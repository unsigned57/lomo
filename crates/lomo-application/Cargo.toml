[package]
name = "lomo-application"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
lomo-core = { path = "../lomo-core" }
lomo-workspace = { path = "../lomo-workspace" }
lomo-store = { path = "../lomo-store" }
lomo-media = { path = "../lomo-media" }
rustix = { workspace = true, features = ["fs", "rand"] }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
pinyin = { workspace = true, features = ["heteronym"] }

[dev-dependencies]
lomo-platform-fs = { path = "../lomo-platform-fs" }
tempfile.workspace = true

