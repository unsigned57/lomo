[package]
name = "lomo-xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "lomo_xtask"
path = "src/lib.rs"

[[bin]]
name = "lomo-xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
lomo-feasibility = { path = "../lomo-feasibility" }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
# Format-preserving TOML reads/rewrites for pin sites (tools.toml, rust-toolchain.toml,
# workspace Cargo.toml). Reuses the version already locked for proc-macro-crate so the
# deny.toml multiple-versions=deny graph keeps exactly one toml_edit build.
toml_edit = "=0.25.13"
tree-sitter = "=0.27.0"
tree-sitter-kotlin-ng = "=1.1.0"
yaml-rust2 = { version = "=0.10.4", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
