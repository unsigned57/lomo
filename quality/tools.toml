[quality]
cargo-deny = "0.20.2"
cargo-nextest = "0.9.151"
cargo-llvm-cov = "0.9.1"
cargo-machete = "0.9.2"
cargo-sweep = "0.8.0"
cargo-ndk = "4.1.2"

[diagnostics]
cargo-bloat = "0.12.1"
