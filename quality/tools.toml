# BoltFFI CLI is repository-owned and exact-pinned. Keep git + rev aligned with Cargo.toml's boltffi_core.
[ffi.boltffi_cli]
package = "boltffi_cli"
binary = "boltffi"
git = "https://github.com/boltffi/boltffi"
rev = "35781dcea9d40ff2d6e3e6de92ac40dbbe5b9c10"
