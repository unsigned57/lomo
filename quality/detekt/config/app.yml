config:
  excludes:
    - "lomo-architecture.*"
    - "lomo-architecture>.*>.*"
complexity:
  ComplexCondition:
    allowedConditions: 4
  CyclomaticComplexMethod:
    allowedComplexity: 20
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
    ignoreNestingFunctions: true
    ignoreLocalFunctions: true
  LongMethod:
    allowedLines: 100
  LongParameterList:
    allowedFunctionParameters: 7
    allowedConstructorParameters: 8
    ignoreDefaultParameters: true
    # Compose hoists state and callbacks into composable parameters that are not independent
    # collaborators. Function-count heuristics must not drive owner splits here; the architecture
    # rules and the type-resolved rules carry the real boundaries.
    ignoreAnnotated:
      - Composable
  NestedBlockDepth:
    allowedDepth: 5
  NestedScopeFunctions:
    active: true
  ReplaceSafeCallChainWithRun:
    active: true
coroutines:
  CoroutineLaunchedInTestWithoutRunTest:
    active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    dispatcherNames:
      - IO
      - Default
      - Main
      - Unconfined
    # The composition root names the process-lifetime dispatchers once; every other site resolves
    # them through DispatcherProvider. Excluding the definition sites is the same treatment
    # domain.yml applies to DefaultDispatcherProvider.
    excludes:
      - "**/app/src/LomoApplication.kt"
      - "**/app/src/di/AppScope.kt"
  SuspendFunInFinallySection:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
exceptions:
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - CancellationException
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  TooGenericExceptionCaught:
    exceptionNames:
      - Throwable
      - RuntimeException
      - Error
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
      - Preview
  InvalidPackageDeclaration:
    rootPackage: com.lomo.app
style:
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: "Use an explicit locale when normalizing case for non-user-facing identifiers."
        value: "kotlin.text.lowercase(kotlin.String)"
      - reason: "Use an explicit locale when normalizing case for non-user-facing identifiers."
        value: "kotlin.text.uppercase(kotlin.String)"
  ForbiddenComment:
    comments:
      - reason: "Resolve backlog markers before merge."
        value: "TODO:"
      - reason: "Resolve broken-behavior markers before merge."
        value: "FIXME:"
      - reason: "Release blockers must not stay in committed code."
        value: "STOPSHIP:"
  ForbiddenImport:
    active: true
    forbiddenImports:
      - com.lomo.data.*
  NullableBooleanCheck:
    active: true
  CanBeNonNullable:
    active: true
  UnusedPrivateProperty:
    active: true
  UseEmptyCounterpart:
    active: true
  UseIsNullOrEmpty:
    active: true
  VarCouldBeVal:
    active: true
  ReturnCount:
    max: 4
    excludeLabeled: true
    excludeGuardClauses: true
lomo-architecture:
  active: true
  NoHandwrittenNativeDeclaration:
    active: true
  NoMutableFlowExposure:
    active: true
  NoInferredMutableFlowExposure:
    active: true
  ResolvedCallGraph:
    active: true
  AppSourceBoundary:
    active: true
  AppManifestBoundary:
    active: true
  ViewModelBoundary:
    active: true
  UseCaseLocation:
    active: true
  NoSourceSuppressions:
    active: true
  NoPlaceholderImplementation:
    active: true
  NoConstantBranchCondition:
    active: true
  NoUnreachableBlockTail:
    active: true
  NoRedundantExhaustiveElse:
    active: true
  NoCrossFileDuplicateTopLevel:
    active: true
    ignoreAnnotated:
      - Composable
      - Preview
    ignoreOperator: true
  NoUnreferencedTopLevelDeclaration:
    active: true
    ignoreAnnotated:
      - VisibleForTesting
      - Keep
      - Preview
      - Module
      - Provides
      - Binds
      - Multibinds
      - HiltViewModel
  NoSwallowedResult:
    active: true
  NoDeprecatedKept:
    active: true
  NoHardcodedVisibleText:
    active: true
  NoLoopBoundaryIo:
    active: true
  NoNestedCollectionScan:
    active: true
  NoFullRebuildInLocalMutation:
    active: true
  NoSwallowedCancellationInSuspend:
    active: true
  NoUnboundedFlowSharing:
    active: true
  NoUnmanagedCoroutineScope:
    active: true
  NoSilentCatchFallback:
    active: true
  NoSwallowedThrowable:
    active: true
  NoStatefulRepositoryOrUseCase:
    active: true
  NoAdHocMemoryCache:
    active: true
  NoUnconfinedIoOrNative:
    active: true
  NoUnpaginatedFullLoad:
    active: true
  ViewModelSingleStateFlow:
    active: true
  NoInSituRevisionBypass:
    active: true
  NoEventInStateFlow:
    active: true
  NoMultipleEffectChannels:
    active: true
  PagingDataCachedIn:
    active: true
  NoWriteOnlyStateFlow:
    active: true
  NoCollaboratorDefaultArg:
    active: true
    forbiddenTypeTokens:
      - Bus
      - Registry
      - Coordinator
  DomainLayerIsolation:
    active: true
  DomainPackageShape:
    active: true
  RepositoryImplLocation:
    active: true
  ComposableLayer:
    active: true
  DataRepositoryContract:
    active: true
  DataLayerUiDependency:
    active: true
  UiComponentsLayerBoundary:
    active: true
  UiComponentDesignTokenUsage:
    active: true
  NoSwallowedCancellationInPagingSource:
    active: true
