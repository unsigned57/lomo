# Capability classification, not a list of libraries that must be installed.
# Classify the selected APIs/features and relevant transitive stack when adding or replacing a library.
# Versions and actual dependency edges belong only to Cargo/Amper manifests and lockfiles.
# Rules and selection workflow: quality/dependencies.md (this file is in quality/).
