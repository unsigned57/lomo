[package]
name = "lomo-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# staticlib feeds BoltFFI Android JNI glue; rlib keeps host facade tests linked.
crate-type = ["staticlib", "rlib"]

[dependencies]
boltffi.workspace = true
lomo-core = { path = "../core" }
lomo-workspace = { path = "../workspace" }
lomo-store = { path = "../store" }
lomo-media = { path = "../media" }
# Production BoltFFI conversion surface for lomo-sync (post P5-13).
lomo-sync = { path = "../sync" }
# Sole git2 adapter composition at the conversion edge (not lomo-sync → lomo-git cycle).
lomo-git = { path = "../git" }
# Stage-6 LAN conversion surface. `lomo-lan` never depends on `lomo-sync`; both meet only here.
lomo-lan = { path = "../lan" }
serde_json.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
tempfile.workspace = true
sha2.workspace = true
git2.workspace = true
lomo-workspace = { path = "../workspace" }
lomo-media = { path = "../media" }
lomo-sync = { path = "../sync" }
lomo-git = { path = "../git" }
lomo-lan = { path = "../lan" }

[lints]
workspace = true
