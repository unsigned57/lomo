[package]
name = "lomo-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# staticlib feeds BoltFFI Android JNI glue; rlib keeps host facade tests linked.
crate-type = ["staticlib", "rlib"]

[dependencies]
boltffi.workspace = true
lomo-core = { path = "../core" }
lomo-workspace = { path = "../workspace" }
lomo-store = { path = "../store" }
lomo-sync-core = { path = "../sync-core" }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
lomo-workspace = { path = "../workspace" }

[lints]
workspace = true
