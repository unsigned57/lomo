[quality]
cargo-deny = "0.19.9"
cargo-nextest = "0.9.138"
cargo-llvm-cov = "0.8.7"
cargo-machete = "0.9.2"
cargo-ndk = "4.1.2"

[diagnostics]
cargo-bloat = "0.12.1"
cargo-llvm-lines = "0.4.46"

# BoltFFI CLI is repository-owned and exact-pinned. Prefer the latest formal tag;
# pin its tip SHA so cargo install --rev and workspace boltffi_core stay aligned.
[ffi.boltffi_cli]
package = "boltffi_cli"
binary = "boltffi"
git = "https://github.com/boltffi/boltffi"
rev = "2e6320a6d92cb591d22b908477f3a47da7ebc9bc"
formal_tag = "v0.30.1"
latest_formal_tag_checked = "v0.30.1"
required_fix = "JVM sequential use-after-close handle guard"
required_fix_commit = "2de4597034e0e66dcdfd34191abbe9ae7de7b31e"
required_fix_in_latest_tag = true
