[package]
name = "lomo-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "lomo"

[lib]
name = "lomo_tui"
path = "src/lib.rs"

[[bin]]
name = "lomo"
path = "src/main.rs"

[dependencies]
lomo-application = { path = "../../crates/lomo-application" }
lomo-platform-fs = { path = "../../crates/lomo-platform-fs" }
lomo-core = { path = "../../crates/lomo-core" }
lomo-workspace = { path = "../../crates/lomo-workspace" }
lomo-media = { path = "../../crates/lomo-media" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64 = "=0.22.1"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.0"
crossterm = { version = "=0.28.1", default-features = false, features = ["events"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde"] }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
