product: jvm/lib

settings:
  junit: junit-5
  jvm:
    release: 25
    jdk:
      version: 27
      selectionMode: javaHome
  kotlin:
    version: 2.4.21
    allWarningsAsErrors: true

dependencies:
  - dev.detekt:detekt-api:2.0.0-alpha.6: compile-only

test-dependencies:
  - io.kotest:kotest-runner-junit5:6.2.7
  - io.kotest:kotest-assertions-core:6.2.7
  - io.kotest:kotest-framework-engine:6.2.7
  - dev.detekt:detekt-test:2.0.0-alpha.6
