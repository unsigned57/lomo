# Backfill and reminder dates share the compact header, and each chip cancels independently.
appId: com.lomo.app
---
- launchApp
- runFlow: setup_workspace.yaml
- runFlow: close_editor.yaml
- tapOn:
    id: "benchmark_main_create_fab"
- runFlow:
    when:
      notVisible: "Backfill Memo"
    commands:
      - tapOn:
          text: "Expand"
          below:
            id: "benchmark_input_editor"
      - waitForAnimationToEnd
- tapOn: "Backfill Memo"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Use time"
- assertVisible:
    id: "benchmark_input_backfill_badge"
- tapOn: "Add reminder"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Confirm"
- assertVisible:
    id: "benchmark_input_reminder_badge"
- waitForAnimationToEnd
- takeScreenshot: editor-metadata-capsules
- tapOn:
    id: "benchmark_input_backfill_badge"
- assertNotVisible:
    id: "benchmark_input_backfill_badge"
- assertVisible:
    id: "benchmark_input_reminder_badge"
- tapOn:
    id: "benchmark_input_reminder_badge"
- assertNotVisible:
    id: "benchmark_input_reminder_badge"
- runFlow: close_editor.yaml
