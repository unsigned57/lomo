# A fenced-code-first memo must never collapse to an empty body.
appId: com.lomo.app
---
- launchApp
- runFlow: setup_workspace.yaml
- tapOn:
    id: "benchmark_main_create_fab"
- tapOn:
    id: "benchmark_input_editor"
- eraseText
- inputText: "```text"
- pressKey: Enter
- inputText: "uitest-code-first-preview"
- pressKey: Enter
- inputText: "line 02"
- pressKey: Enter
- inputText: "line 03"
- pressKey: Enter
- inputText: "line 04"
- pressKey: Enter
- inputText: "line 05"
- pressKey: Enter
- inputText: "line 06"
- pressKey: Enter
- inputText: "line 07"
- pressKey: Enter
- inputText: "line 08"
- pressKey: Enter
- inputText: "line 09"
- pressKey: Enter
- inputText: "line 10"
- pressKey: Enter
- inputText: "line 11"
- pressKey: Enter
- inputText: "line 12"
- pressKey: Enter
- inputText: "line 13"
- pressKey: Enter
- inputText: "line 14"
- pressKey: Enter
- inputText: "line 15"
- pressKey: Enter
- inputText: "uitest-code-end"
- pressKey: Enter
- inputText: "```"
- hideKeyboard
- tapOn:
    id: "benchmark_input_submit"
- assertNotVisible:
    id: "benchmark_input_editor"
- waitForAnimationToEnd
- assertVisible: ".*uitest-code-first-preview.*"
- takeScreenshot: code-collapsed
- tapOn: ".*uitest-code-first-preview.*"
- scrollUntilVisible:
    element:
      text: "Collapse"
    direction: DOWN
- takeScreenshot: code-expanded
