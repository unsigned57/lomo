appId: com.lomo.app
---
- extendedWaitUntil:
    notVisible:
      id: "benchmark_lan_batch_root"
    timeout: 30000
- back
- waitForAnimationToEnd
- assertVisible:
    id: "benchmark_main_root"
- runFlow: verify-incoming.yaml
