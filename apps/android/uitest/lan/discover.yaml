# Part of the opt-in two-device LAN journey; run via just uitest lan_share.
appId: com.lomo.app
---
- extendedWaitUntil:
    visible:
      id: "benchmark_lan_peer_name"
      text: '(?s)${LAN_PEER_NAME}(\s.*)?'
    timeout: 30000
- assertNotVisible:
    id: "benchmark_lan_peer_name"
    text: '(?s)${LAN_DEVICE_NAME}(\s.*)?'
- takeScreenshot: discovered-peer
